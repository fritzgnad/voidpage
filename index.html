<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VoidPage</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="drag-region">
      <img class="logo" src="./voidpage_logo.png" alt="VoidPage" draggable="false" />
    </div>
    <div class="sky">
      <div class="page-frame">
        <textarea
          id="editor"
          spellcheck="false"
          autofocus
          placeholder="Start writing …"
        ></textarea>
      </div>

      <div class="status-bar">
        <span id="file-name">untitled.md</span>
        <span class="hint">⌘N new &nbsp;•&nbsp; ⌘O open &nbsp;•&nbsp; ⌘S save &nbsp;•&nbsp; ⇧⌘S save as</span>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
